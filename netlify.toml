[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Pretty URLs: /products resolves to /products.html
[build.processing]
  skip_processing = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self), microphone=(), payment=(), usb=(), bluetooth=(), serial=(), hid=(), browsing-topics=()"
    # Keeps other sites from holding a handle on our windows (tab-nabbing) or
    # embedding our pages and files in theirs.
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    # Browsers only honour HSTS when it arrives over HTTPS, so this is inert until
    # the certificate is live and then pins visitors to HTTPS for a year.
    Strict-Transport-Security = "max-age=31536000"
    # Every page loads its scripts from /assets/js and its fonts from Google.
    # There is no inline JS anywhere; style-src needs 'unsafe-inline' only
    # because the markup uses style="" attributes for one-off layout nudges.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# The console is not a place for search engines, framing or shared caches.
[[headers]]
  for = "/dashboard"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Cache-Control = "no-store"

# Canonical host is www.enapoint.com (every page's <link rel="canonical"> and
# og:url point there). The apex -> www redirect is deliberately NOT forced here:
# Netlify already redirects every domain alias to the primary domain, and a forced
# rule that disagrees with the primary-domain setting creates a redirect loop the
# moment HTTPS is live. Set www.enapoint.com as the primary domain in Netlify.

# Automated scanners probe every site for WordPress, PHP and leaked config files.
# None exist here; answering with a plain 404 up front keeps that noise out of the
# functions and gives scanners nothing to fingerprint.
[[redirects]]
  from = "/wp-admin/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-content/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-includes/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-login.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/xmlrpc.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/phpmyadmin/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/console"
  to = "/dashboard"
  status = 301

[[redirects]]
  from = "/register-meter"
  to = "/register"
  status = 301

[[redirects]]
  from = "/docs"
  to = "/developers"
  status = 302

# Partner tooling (Swagger UI, Postman, code generators) fetches the spec cross-origin.
[[headers]]
  for = "/openapi.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"
    Cache-Control = "public, max-age=300"
